# Runs `make check`. This repository is public, so nothing here needs a secret -- which is
# the reason the ruleset lives here rather than inside the private agent-standards: CI in
# a private repository cannot read another private repository without a credential to mint,
# store and rotate, and these rules contain nothing worth protecting.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make check
